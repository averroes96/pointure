name: Build Windows Desktop Installer

on:
  push:
    branches:
      - main
      - feature/windows-desktop-installer
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Package ShoeDZ Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Execute Windows Desktop Build Pipeline
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File desktop\scripts\build.ps1

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShoeDZ-Setup-Windows-x64
          path: desktop/dist/ShoeDZ-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release Asset (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/ShoeDZ-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
