<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>ShoeDZ - Démarrage</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 1px 3px rgba(0, 0, 0, 0.05);
      padding: 36px 32px;
      text-align: center;
      width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #e2e8f0;
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
      box-shadow: 0 8px 16px rgba(79, 70, 229, 0.25);
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background-color: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-bar {
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #4f46e5, #3b82f6);
      border-radius: 999px;
      animation: indeterminate 1.4s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    #status {
      font-size: 12px;
      color: #64748b;
      min-height: 36px;
      line-height: 18px;
      max-width: 100%;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-word;
    }
    #error-box {
      display: none;
      margin-top: 12px;
      padding: 10px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      font-size: 11px;
      color: #991b1b;
      text-align: left;
      max-height: 110px;
      width: 100%;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
    }
    #actions {
      display: none;
      gap: 8px;
      margin-top: 12px;
      width: 100%;
    }
    #actions button {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: #0f172a;
    }
    #actions button.primary {
      background: #4f46e5;
      border-color: #4f46e5;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">👟</div>
    <h1 class="title">ShoeDZ</h1>
    <p class="subtitle">Gestion Point de Vente & Stock</p>

    <div class="progress-track" id="progress-container">
      <div class="progress-bar"></div>
    </div>
    <div id="status">Chargement de l'application...</div>
    <div id="error-box"></div>
    <div id="actions">
      <button id="btn-logs" class="primary">Ouvrir les journaux</button>
      <button id="btn-quit">Quitter</button>
    </div>
  </div>

  <script>
    if (window.electronAPI) {
      window.electronAPI.onStatus((status) => {
        // Show only the last line so multi-line output never overflows the card
        const lines = String(status).split(/\r?\n/).filter(Boolean);
        document.getElementById('status').innerText = lines[lines.length - 1] || '';
      });
      window.electronAPI.onError((err) => {
        document.getElementById('progress-container').style.display = 'none';
        document.getElementById('status').innerText = 'Erreur au démarrage';
        document.getElementById('status').style.color = '#dc2626';
        const errBox = document.getElementById('error-box');
        errBox.style.display = 'block';
        errBox.innerText = err;
        document.getElementById('actions').style.display = 'flex';
      });
      document.getElementById('btn-logs').onclick = () => window.electronAPI.openLogsFolder();
      document.getElementById('btn-quit').onclick = () => window.electronAPI.quitApp();
    }
  </script>
</body>
</html>
