name: Build Windows Desktop Installer

on:
  push:
    branches:
      - main
      - feature/windows-desktop-installer
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Package ShoeDZ Windows Installer (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Execute Windows Desktop Build Pipeline (x64)
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          powershell -ExecutionPolicy Bypass -File desktop\scripts\build.ps1 -Arch x64

      - name: Upload Installer Artifact (x64)
        uses: actions/upload-artifact@v4
        with:
          name: ShoeDZ-Setup-Windows-x64
          path: |
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release Asset (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
