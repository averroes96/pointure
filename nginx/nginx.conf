# ── ShoeDZ / Pointure — Cloud / SaaS Production Nginx Config ────────────────
# Expects:
#   - backend service named "backend" on port 8000
#   - frontend service named "frontend" on port 80
#   - static files volume mounted at /static
#   - media files volume mounted at /media
#   - TLS certificates from Let's Encrypt at /etc/letsencrypt/live/$DOMAIN/
#
# Replace "yourdomain.com" with your actual domain before deploying.

upstream django {
    server backend:8000;
}

upstream spa {
    server frontend:80;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name yourdomain.com;

    # ── TLS certificates (Let's Encrypt / Certbot) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    # ── Django static files ──────────────────────────────────────────────────
    location /static/ {
        alias /static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── User-uploaded media ──────────────────────────────────────────────────
    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Django API + admin ───────────────────────────────────────────────────
    location ~ ^/(api|admin|schema|docs)/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── React SPA (everything else) ──────────────────────────────────────────
    location / {
        proxy_pass         http://spa;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
