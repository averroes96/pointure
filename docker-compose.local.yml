version: "3.9"

# ── ShoeDZ / Pointure — Self-Hosted (On-Premise) Docker Compose ─────────────
#
# Usage:
#   1.  cp .env.local.example .env.local   # fill in required values
#   2.  docker compose -f docker-compose.local.yml up -d --build
#   3.  docker compose -f docker-compose.local.yml exec backend \
#           python manage.py migrate
#   4.  docker compose -f docker-compose.local.yml exec backend \
#           python manage.py createsuperuser
#   5.  docker compose -f docker-compose.local.yml exec backend \
#           python manage.py activate_license <YOUR-LICENSE-KEY>
#
# The application will then be available at http://localhost
#
# Key differences from docker-compose.prod.yml:
#   - No SSL / TLS (local network only)
#   - Port 80 bound to 127.0.0.1 (loopback only)
#   - No external cloud storage — media stored on local volume
#   - Frontend service included (multi-stage build)
#   - DEPLOYMENT_MODE=local enables license enforcement
#   - Separate local settings (SECURE_SSL_REDIRECT=False)

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-shodz}
      POSTGRES_USER: ${DB_USER:-shodz}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shodz_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-shodz}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - shodz_local

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    command: >
      gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 2
        --worker-class gthread
        --threads 2
        --timeout 120
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - machine_id:/var/lib/shodz
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DEPLOYMENT_MODE=local
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shodz_local

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    command: celery -A config worker -l warning -Q default,pdf,notifications --concurrency 2
    volumes:
      - media_files:/app/media
      - machine_id:/var/lib/shodz
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DEPLOYMENT_MODE=local
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shodz_local

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    command: >
      celery -A config beat -l warning
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - machine_id:/var/lib/shodz
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DEPLOYMENT_MODE=local
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shodz_local

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Relative URL — the main nginx proxies /api/ to Django
        VITE_API_URL: /api
    restart: always
    networks:
      - shodz_local

  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/static:ro
      - media_files:/media:ro
    ports:
      # Dynamically set by install.sh or .env.local
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-80}:80"
    depends_on:
      - backend
      - frontend
    networks:
      - shodz_local

  db-backup:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-shodz}
      POSTGRES_USER: ${DB_USER:-shodz}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shodz_local
    # Runs pg_dump at 2:00 AM every day and deletes backups older than 7 days
    command: >
      sh -c 'echo "0 2 * * * pg_dump -h db -U $${POSTGRES_USER} $${POSTGRES_DB} | gzip > /backups/db_backup_\$$(date +\%Y\%m\%d_\%H\%M\%S).sql.gz && find /backups -type f -name \"db_backup_*.sql.gz\" -mtime +7 -delete" > /etc/crontabs/root && crond -f'

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
  # Persists the machine UUID across container restarts
  machine_id:

networks:
  shodz_local:
    driver: bridge
