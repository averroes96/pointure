name: pointure-cloud
region: fra1

databases:
  - name: pointure-db
    engine: PG
    version: "18"

services:
  - name: pointure-redis
    image:
      registry_type: DOCKER_HUB
      repository: redis
      tag: "7.0-alpine"
    internal_ports:
      - 6379

  - name: pointure-backend
    github:
      branch: main
      repo: averroes96/pointure
      deploy_on_push: true
    dockerfile_path: backend/Dockerfile.prod
    source_dir: backend
    run_command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --worker-class gthread --threads 2 --timeout 120
    http_port: 8000
    routes:
      - path: /
    envs:
      - key: DJANGO_SETTINGS_MODULE
        scope: RUN_AND_BUILD_TIME
        value: config.settings.production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${pointure-db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: redis://pointure-redis:6379/0
      - key: SECRET_KEY
        scope: RUN_TIME
        value: REPLACE_ME_WITH_A_SECURE_SECRET_KEY
      - key: PGOPTIONS
        scope: RUN_TIME
        value: "-c search_path=pointure_schema,public"
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_TIME
        value: https://${APP_DOMAIN}
      - key: ALLOWED_HOSTS
        scope: RUN_TIME
        value: ${APP_DOMAIN}
      - key: EMAIL_HOST
        scope: RUN_AND_BUILD_TIME
        value: "localhost"
      - key: EMAIL_HOST_USER
        scope: RUN_AND_BUILD_TIME
        value: ""
      - key: EMAIL_HOST_PASSWORD
        scope: RUN_AND_BUILD_TIME
        value: ""

workers:
  - name: pointure-worker
    github:
      branch: main
      repo: averroes96/pointure
      deploy_on_push: true
    dockerfile_path: backend/Dockerfile.prod
    source_dir: backend
    run_command: celery -A config worker -l warning -Q default,pdf,notifications --concurrency 4
    envs:
      - key: DJANGO_SETTINGS_MODULE
        scope: RUN_AND_BUILD_TIME
        value: config.settings.production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${pointure-db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: redis://pointure-redis:6379/0
      - key: SECRET_KEY
        scope: RUN_TIME
        value: REPLACE_ME_WITH_A_SECURE_SECRET_KEY
      - key: PGOPTIONS
        scope: RUN_TIME
        value: "-c search_path=pointure_schema,public"
      - key: EMAIL_HOST
        scope: RUN_AND_BUILD_TIME
        value: "localhost"
      - key: EMAIL_HOST_USER
        scope: RUN_AND_BUILD_TIME
        value: ""
      - key: EMAIL_HOST_PASSWORD
        scope: RUN_AND_BUILD_TIME
        value: ""

