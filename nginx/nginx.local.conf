# ── ShoeDZ / Pointure — Self-Hosted Local Nginx Config ──────────────────────
# Used by docker-compose.local.yml for on-premise / self-hosted installs.
#
# Key differences from nginx.conf:
#   - HTTP only (no TLS) — intended for localhost / LAN use
#   - No HSTS or SSL redirect
#   - Binds on all interfaces; Docker will constrain to 127.0.0.1 via compose

upstream django_local {
    server backend:8000;
}

upstream spa_local {
    server frontend:80;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    # ── Security headers (no HTTPS-only ones) ────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    # ── Django static files ──────────────────────────────────────────────────
    location /static/ {
        alias /static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── User-uploaded media ──────────────────────────────────────────────────
    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Django API + admin ───────────────────────────────────────────────────
    location ~ ^/(api|admin|schema|docs)/ {
        proxy_pass         http://django_local;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto http;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── React SPA (everything else) ──────────────────────────────────────────
    location / {
        proxy_pass         http://spa_local;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto http;
    }
}
