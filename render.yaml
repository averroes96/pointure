services:
  - type: web
    name: shodz-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.render
      - key: DEPLOYMENT_MODE
        value: cloud
      - key: STORAGE_PROVIDER
        value: local
      - key: SECRET_KEY
        generateValue: true
      # Set these manually in the Render dashboard after first deploy:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
