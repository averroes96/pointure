name: Build Windows Desktop Installer

on:
  push:
    branches:
      - release
      - feature/windows-desktop-installer
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Backend & Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-desktop.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-desktop.txt pytest pytest-django

      - name: Run backend tests
        working-directory: backend
        run: pytest -p no:cacheprovider -q

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend typecheck and tests
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm test

  determine-release:
    name: Determine Semantic Version & Tag
    needs: test
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.versioner.outputs.should_release }}
      tag: ${{ steps.versioner.outputs.tag }}
      version: ${{ steps.versioner.outputs.version }}
      bump: ${{ steps.versioner.outputs.bump }}
      changelog: ${{ steps.versioner.outputs.changelog }}
    steps:
      - name: Checkout repository (full history for tags & changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Calculate Next Version, Generate Changelog & Tag
        id: versioner
        run: |
          node desktop/scripts/release-tagger.js --ci --create-tag
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}

  build-windows:
    name: Package ShoeDZ Windows Installer (${{ matrix.arch }})
    needs: [test, determine-release]
    if: needs.determine-release.outputs.should_release == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Cache Electron and electron-builder tools
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.arch }}-
            electron-${{ runner.os }}-

      - name: Sync package version from release tag
        shell: powershell
        run: |
          $version = "${{ needs.determine-release.outputs.version }}"
          Write-Host "Syncing package.json versions to: $version"
          npm --prefix desktop version $version --no-git-tag-version --allow-same-version
          npm --prefix frontend version $version --no-git-tag-version --allow-same-version

      - name: Execute Windows Desktop Build Pipeline (${{ matrix.arch }})
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          powershell -ExecutionPolicy Bypass -File desktop\scripts\build.ps1 -Arch ${{ matrix.arch }}

      - name: Upload Installer Artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ShoeDZ-Setup-Windows-${{ matrix.arch }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest-*.yml
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish Multi-Architecture Release (x64 & ia32)
    needs: [build-windows, determine-release]
    if: needs.determine-release.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ShoeDZ-Setup-Windows-*
          path: release-staging
          merge-multiple: true

      - name: Generate Unified Multi-Architecture latest.yml
        shell: powershell
        run: |
          node desktop/scripts/merge-release-yml.js release-staging/latest-x64.yml release-staging/latest-ia32.yml release-staging/latest.yml
          Write-Host "`nGenerated Unified latest.yml content:"
          Get-Content release-staging/latest.yml

      - name: Publish Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-release.outputs.tag }}
          name: ShoeDZ Desktop ${{ needs.determine-release.outputs.tag }}
          body: ${{ needs.determine-release.outputs.changelog }}
          files: |
            release-staging/*.exe
            release-staging/*.blockmap
            release-staging/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
